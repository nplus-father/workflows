name: "Astro Portal Build and Deploy"

# Reusable: build + deploy for the nplus.wiki portal site
# (nplus-father/nplus-father.github.io). Differs from astro-build-deploy.yml
# by running tests and fetching repo metadata from GitHub before build.
#
# Secrets (passed via `secrets:` from caller):
#   PORTAL_APP_ID / PORTAL_APP_PRIVATE_KEY — GitHub App 的憑證。有設就用它換
#     installation token 去讀 org 的 repo metadata。**優先於 PAT。**
#   PORTAL_GH_TOKEN — 舊路徑：使用者 PAT（`repo` scope）。App 沒設定時的退路。
#
# 為什麼要多一條 App 路徑：REST 的 5,000/hr 是綁在「使用者」身上的，Andrew 名下
# 每一個 PAT 加上 gh CLI 全部共用同一個池。所以這個 production build 會被終端機的
# 隨手操作餓死 —— 已經發生兩次（2026-08-18 03:37 UTC、2026-08-19 07:00 UTC，
# 後者是一輪 1753 個 repo 的 REST 掃描）。fetch-repos.ts 的註解早就記下這件事。
#
# App installation 是獨立身分、獨立額度（org 安裝 5,000/hr 起，每超過 20 個 repo
# 再 +50/hr，上限 12,500/hr）。重點不是額度變大 —— 例行工作連 500/hr 都用不到 ——
# 而是**隔離**：入口網不該跟別人的活動共命運。

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      run-lint:
        type: boolean
        default: true
      run-test:
        type: boolean
        default: true
      runner-labels:
        # JSON array of runner labels for the build job. Leave empty and the
        # workflow picks: private caller → self-hosted pool (the portal repo is
        # private and org-owned, so it qualifies), public caller → GitHub-hosted.
        # See the runs-on comment below. Deploy follows the same rule —
        # the Pages OIDC token is also available on self-hosted runners.
        type: string
        default: ''
    secrets:
      PORTAL_APP_ID:
        required: false
      PORTAL_APP_PRIVATE_KEY:
        required: false
      PORTAL_GH_TOKEN:
        # App 那組設好之後這個就可以拿掉；在那之前它仍是實際生效的路徑，
        # 所以維持 required: false 而不是直接刪，才能兩種設定都跑得起來。
        required: false
      GATE_BUILD_TOKEN:
        # Shared secret that lets the build read each station's deployed
        # index.json through the nplus.wiki gate (the Worker checks the
        # `x-gate-build` header). Optional — without it the fetchers silently
        # carry over their previous values, which is how the /health/ word
        # counts froze on 2026-08-18 with CI green.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Security boundary, not a preference — a fork PR against a PUBLIC repo runs
    # attacker-authored code, and the self-hosted runners sit on the host that
    # holds the production kubeconfig. Deciding it here (instead of trusting every
    # caller to override) is what makes forgetting it safe: the old default was
    # self-hosted-for-everyone. Missing `private` on an event payload falls through
    # to ubuntu-latest — the safe direction to fail.
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    env:
      # `secrets` 這個 context 在 step 的 `if:` 裡讀不到（GitHub 的 context
      # availability 表沒有列它），所以要判斷「App 有沒有設定」只能先落到 env。
      # 直接寫 if: secrets.PORTAL_APP_ID != '' 會恆為 false，安靜地永遠走 PAT。
      PORTAL_APP_ID: ${{ secrets.PORTAL_APP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Test
        if: ${{ inputs.run-test }}
        run: npm run test

      # owner 指到 org（而不是留空）才會拿到涵蓋整個 installation 的 token；
      # 留空的話 scope 只有目前這個 repo，讀不到另外 1800 個 book repo。
      - name: Mint a GitHub App installation token
        id: app-token
        if: env.PORTAL_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PORTAL_APP_ID }}
          private-key: ${{ secrets.PORTAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch portal repo data from GitHub
        env:
          # App 沒設定時上一步是 skipped，outputs.token 是空字串 → 退回 PAT。
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.PORTAL_GH_TOKEN }}
          # 只掃 org。fetch-repos.ts 的預設是 "nplus-father,Andrewnplus"，而個人
          # 帳號那一支走的是 `GET /user/repos` —— **installation token 打不了那個
          # 端點**（403 Resource not accessible by integration），因為 token 綁的是
          # 「安裝」不是「使用者」。App 切換後第一次 build 就是這樣掛的。
          #
          # 把它拿掉沒有損失：實測 Andrewnplus 有 11 個 repo 可見，但帶 nplus-portal
          # topic 的是 0 個，產出的 repos.json 1861 項全部來自 org。
          #
          # 哪天真的要收個人帳號的 repo，正解不是把這行改回去（PAT 路徑會回來，
          # 額度共用的問題也跟著回來），而是把 App 也安裝到 Andrewnplus 帳號、
          # 並改用 GET /installation/repositories。
          PORTAL_OWNERS: nplus-father
        run: npm run fetch-repos
      - name: Fetch response-articles manifest
        # Pulls https://andrewnplus.github.io/responses.json so book cards
        # can show "已回應" badges. Failure is non-fatal — the script
        # writes an empty stub and the build continues.
        run: npm run fetch-responses

      - name: Build
        env:
          # prebuild runs fetch-index / fetch-stations / fetch-health, which read
          # the deployed sites from behind the gate. Unset → they carry over.
          GATE_BUILD_TOKEN: ${{ secrets.GATE_BUILD_TOKEN }}
        run: npm run build

      # Pages API 偶發 503，重試一次。理由與 astro-build-deploy.yml 同一條。
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Retry configure-pages
        if: steps.pages.outcome == 'failure'
        run: sleep 15

      - if: steps.pages.outcome == 'failure'
        uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # 與 build 同一條規則：private → 自家 runner，public → GitHub-hosted。
    # OIDC id-token 在 self-hosted 一樣拿得到（astro-build-deploy.yml 同款註解）。
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # timeout 砍半 + 重試一次，理由與 astro-build-deploy.yml 同一條。
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 300000

      # 退避再重試，理由與 hugobook-build-deploy.yml 同一條（見那份的長註解）：佇列塞住時
      # 立刻重試只是再撞一次，而且會被第一次 timeout 自己發出的取消掃到。抖動是為了不讓
      # 同時失敗的多個 repo 在同一秒一起重試。
      - name: Back off before retrying the Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: |
          wait=$(( 60 + RANDOM % 120 ))
          echo "Pages deploy failed; backing off ${wait}s before the retry."
          sleep "$wait"

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 300000
