name: "Astro CI Check"

# Reusable: full lint + format + build verification on PRs.
# Note stations additionally define `deps:check` (notes-core's notes-doctor), which
# fails the run when their pinned dependency versions drift from notes-core's
# versions.json. Sites without that script just skip the step.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      runner-labels:
        # JSON array of runner labels. Defaults to our self-hosted pool; the
        # image already ships Node 22 (see gh-runner/Dockerfile.runner).
        # Callers that CANNOT use it must override with '["ubuntu-latest"]':
        #   - public repos (fork PRs would run arbitrary code on our host)
        #   - repos owned by Andrewnplus (org runners only serve org repos)
        type: string
        default: '["self-hosted","linux","hugobook"]'

jobs:
  check:
    runs-on: ${{ fromJSON(inputs['runner-labels']) }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci
      - name: Dependency drift (note stations only)
        run: npm run --if-present deps:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
