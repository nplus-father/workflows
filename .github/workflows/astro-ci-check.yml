name: "Astro CI Check"

# Reusable: full lint + format + build verification on PRs.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
