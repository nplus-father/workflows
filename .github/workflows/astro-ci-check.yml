name: "Astro CI Check"

# Reusable: full lint + format + build verification on PRs.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

permissions:
  contents: read
  packages: read # 讀取 @nplus-father/notes-core（GitHub Packages）

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@nplus-father"

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
