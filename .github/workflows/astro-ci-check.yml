name: "Astro CI Check"

# Reusable: full lint + format + build verification on PRs.
# Note stations additionally define `deps:check` (notes-core's notes-doctor), which
# fails the run when their pinned dependency versions drift from notes-core's
# versions.json. Sites without that script just skip the step.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      run-lint:
        # 同 astro-build-deploy.yml 的同名 input —— 兩條共用流程的 caller 介面
        # 必須一致，否則一個站在 deploy 關得掉、在 PR gate 關不掉。不是每個
        # Astro 站都有 lint / format:check script（visualization-sites 那批只有
        # build/dev/preview），而 `npm run lint` 對缺席的 script 是 exit 1。
        # 刻意用顯式開關而不是 `--if-present`：後者會讓打錯字的 script 名靜默
        # 消失，那正是 gate 最不該有的失敗形狀。
        type: boolean
        default: true
      run-format-check:
        type: boolean
        default: true
      runner-labels:
        # JSON array of runner labels. Leave empty and the workflow picks:
        # private caller → self-hosted pool, public caller → GitHub-hosted
        # (see the runs-on comment below). Set it only to force a pool —
        # e.g. repos owned by Andrewnplus, since org runners only serve org repos.
        # Node comes from setup-node above, NOT from the host PATH — the
        # runners' .path has no nvm, so bare `node` there is /usr/bin/node 18.
        type: string
        default: ''

jobs:
  check:
    # Security boundary, not a preference — a fork PR against a PUBLIC repo runs
    # attacker-authored code, and the self-hosted runners sit on the host that
    # holds the production kubeconfig. Deciding it here (instead of trusting every
    # caller to override) is what makes forgetting it safe: the old default was
    # self-hosted-for-everyone. Missing `private` on an event payload falls through
    # to ubuntu-latest — the safe direction to fail.
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm ci
      - name: Dependency drift (note stations only)
        run: npm run --if-present deps:check
      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint
      - name: Format check
        if: ${{ inputs.run-format-check }}
        run: npm run format:check
      - run: npm run build
