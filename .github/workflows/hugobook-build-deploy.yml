name: 'HugoBook Build and Deploy'

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: '0.163.3'
      java-version:
        type: string
        default: '25'
      base-url-prefix:
        type: string
        default: 'https://nplus.wiki'
      run-spotless:
        type: boolean
        default: true
      deploy-mode:
        type: string
        default: 'pages-artifact'
      deploy:
        # Set false for a build-only gate (e.g. Renovate PR check): runs the
        # full build but skips artifact upload and the deploy jobs.
        type: boolean
        default: true
      runner-labels:
        # JSON array of runner labels for the build job. Leave empty and the
        # workflow picks for you — see the runs-on comment below. Set it only
        # to force a specific pool.
        type: string
        default: ''

jobs:
  build:
    # Private caller → our self-hosted pool. Public caller → GitHub-hosted.
    #
    # This is a security boundary, not a preference: a fork PR against a PUBLIC
    # repo runs attacker-authored code, and our self-hosted runners are on a host
    # that also holds the production kubeconfig. It is decided HERE rather than
    # left to each caller because the old default was self-hosted-for-everyone —
    # a caller that simply forgot to override got the unsafe pool silently.
    # hugo-book-template is public and did exactly that.
    #
    # `github.event.repository.private` is absent on some event payloads; that
    # falls through to ubuntu-latest, which is the safe direction to fail.
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is required: site/hugo.toml sets enableGitInfo=true,
          # so Hugo derives each page's lastmod from the full git log. A shallow
          # clone would collapse every page's lastmod to the latest commit date.
          fetch-depth: 0
          # ...but do a blobless partial clone. GitInfo only needs the commit +
          # tree graph (to find which commit last touched each file), NOT the
          # contents of every historical blob. filter=blob:none fetches those
          # blobs on demand, cutting the clone transfer for these image-heavy
          # book repos (~68 MB .git) while keeping lastmod correct.
          filter: blob:none
          # submodules dropped: no repo in the fleet has a .gitmodules (the
          # HugoBook theme is a Hugo module via go.mod, not a git submodule),
          # so submodules: recursive was a no-op.

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # No actions/cache here. These jobs run on our self-hosted [hugobook]
      # runners, where the dependency caches are already persistent AND shared
      # across all 10 runners via pinned paths in each runner's .env:
      #   GRADLE_USER_HOME=/home/andrew/.gradle   (Gradle deps + wrapper)
      #   GOMODCACHE=/home/andrew/go/pkg/mod      (Hugo book-theme modules)
      #   HUGO_CACHEDIR=/home/andrew/.cache/hugo  (Hugo file cache)
      # actions/cache would tar those multi-GB dirs, upload them to GitHub's
      # cloud, and download them back every run — per repo — which is pure
      # waste on disk-persistent runners and risks concurrent-write corruption
      # of the shared ~/.gradle. On-disk sharing already covers every repo.

      - name: Spotless check
        if: ${{ inputs.run-spotless }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew spotlessCheck --no-daemon

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      - name: Verify Hugo version
        # Fail fast if a stale self-hosted-runner hugo shadows the one just
        # installed (the recurring setup-hugo flake). Turns a silent wrong-version
        # build into an immediate, obvious failure — rerun lands on a clean runner.
        run: |
          installed=$(hugo version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Hugo on PATH: $installed (expected ${{ inputs.hugo-version }})"
          if [ "$installed" != "${{ inputs.hugo-version }}" ]; then
            echo "::error::Hugo version mismatch: got '$installed', expected '${{ inputs.hugo-version }}'. Likely a stale hugo on this self-hosted runner's PATH — rerun this job."
            exit 1
          fi

      - name: Build site
        working-directory: site
        run: |
          hugo --minify --gc \
            --baseURL "${{ inputs.base-url-prefix }}/${{ github.event.repository.name }}/"
          # cacheDir intentionally omitted: Hugo uses $HUGO_CACHEDIR
          # (/home/andrew/.cache/hugo), a persistent cache shared across runners,
          # instead of a per-job /tmp dir that was thrown away every run.

      - name: Upload Pages artifact
        if: ${{ inputs.deploy && inputs.deploy-mode == 'pages-artifact' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

      - name: Upload site artifact (legacy path)
        if: ${{ inputs.deploy && inputs.deploy-mode == 'gh-pages-branch' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: site/public
          retention-days: 1

  deploy-pages:
    if: ${{ inputs.deploy && inputs.deploy-mode == 'pages-artifact' }}
    needs: build
    # 與 build 同一條規則：private → 自家 runner，public → GitHub-hosted。
    # deploy-pages 是純 node action，OIDC id-token 在 self-hosted 一樣拿得到；
    # private repo 的 hosted job 計費無條件進位 1 分鐘，全庫 flush 時很可觀。
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # timeout 砍半 + 重試一次，理由與 astro-build-deploy.yml 同一條。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 300000

      - name: Retry deploy to GitHub Pages
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 300000

  deploy-gh-pages-branch:
    if: ${{ inputs.deploy && inputs.deploy-mode == 'gh-pages-branch' }}
    needs: build
    # 與 deploy-pages 同一條規則，理由見上。
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-public
          path: ./public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: false
