name: 'HugoBook Build and Deploy'

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: '0.154.5'
      java-version:
        type: string
        default: '25'
      base-url-prefix:
        type: string
        default: 'https://nplus.wiki'
      run-spotless:
        type: boolean
        default: true
      deploy-mode:
        type: string
        default: 'pages-artifact'

jobs:
  build:
    runs-on: [self-hosted, linux, hugobook]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java (override runner image default)
        if: ${{ inputs.java-version != '25' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache Hugo modules
        uses: actions/cache@v5
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-hugo-

      - name: Spotless check
        if: ${{ inputs.run-spotless }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew spotlessCheck --no-daemon

      - name: Setup Hugo (override runner image default)
        if: ${{ inputs.hugo-version != '0.154.5' }}
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ inputs.hugo-version }}
          extended: true

      - name: Build site
        working-directory: site
        run: |
          hugo --minify --gc \
            --baseURL "${{ inputs.base-url-prefix }}/${{ github.event.repository.name }}/" \
            --cacheDir /tmp/hugo_cache

      - name: Upload Pages artifact
        if: ${{ inputs.deploy-mode == 'pages-artifact' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

      - name: Upload site artifact (legacy path)
        if: ${{ inputs.deploy-mode == 'gh-pages-branch' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: site/public
          retention-days: 1

  deploy-pages:
    if: ${{ inputs.deploy-mode == 'pages-artifact' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-gh-pages-branch:
    if: ${{ inputs.deploy-mode == 'gh-pages-branch' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-public
          path: ./public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          keep_files: false
