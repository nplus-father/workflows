name: 'HugoBook Build and Deploy'

on:
  workflow_call:
    inputs:
      hugo-version:
        type: string
        default: '0.154.5'
      java-version:
        type: string
        default: '25'
      base-url-prefix:
        type: string
        default: 'https://nplus.wiki'
      run-spotless:
        type: boolean
        default: true
      deploy-mode:
        type: string
        default: 'pages-artifact'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "build stub; hugo-version=${{ inputs.hugo-version }}"

  deploy-pages:
    if: ${{ inputs.deploy-mode == 'pages-artifact' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy-pages stub"

  deploy-gh-pages-branch:
    if: ${{ inputs.deploy-mode == 'gh-pages-branch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "gh-pages-branch stub"
