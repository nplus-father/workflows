name: "Astro Build and Deploy"

# Reusable: build an Astro site and publish via GitHub Pages (artifact mode).
# Used by all nplus-father/Andrewnplus Astro repos.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      run-lint:
        type: boolean
        default: true
      run-format-check:
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read # 讀取 @nplus-father/notes-core（GitHub Packages）

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # skip git hook install in CI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@nplus-father"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Format check
        if: ${{ inputs.run-format-check }}
        run: npm run format:check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
