name: "Astro Build and Deploy"

# Reusable: build an Astro site and publish via GitHub Pages (artifact mode).
# Used by all nplus-father/Andrewnplus Astro repos.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "24"
      run-lint:
        type: boolean
        default: true
      run-format-check:
        type: boolean
        default: true
      runner-labels:
        # JSON array of runner labels for the build job. Leave empty and the
        # workflow picks: private caller → self-hosted pool (the image already
        # ships Node 22, see gh-runner/Dockerfile.runner), public caller →
        # GitHub-hosted. See the runs-on comment below. Set it only to force a
        # pool — e.g. repos owned by Andrewnplus (org runners serve org repos only).
        # The deploy job always stays GitHub-hosted (actions/deploy-pages
        # needs the github-pages environment's OIDC token).
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Security boundary, not a preference — a fork PR against a PUBLIC repo runs
    # attacker-authored code, and the self-hosted runners sit on the host that
    # holds the production kubeconfig. Deciding it here (instead of trusting every
    # caller to override) is what makes forgetting it safe: the old default was
    # self-hosted-for-everyone. Missing `private` on an event payload falls through
    # to ubuntu-latest — the safe direction to fail.
    runs-on: ${{ fromJSON(inputs['runner-labels'] != '' && inputs['runner-labels'] || (github.event.repository.private && '["self-hosted","linux","hugobook"]' || '["ubuntu-latest"]')) }}
    env:
      HUSKY: 0 # skip git hook install in CI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Format check
        if: ${{ inputs.run-format-check }}
        run: npm run format:check

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
