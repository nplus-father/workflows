# Drop this file into an Astro repo as .github/workflows/ci-check.yml.

name: CI Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    uses: nplus-father/workflows/.github/workflows/astro-ci-check.yml@v1
    secrets: inherit
    # Builds run on the self-hosted [hugobook] pool by default. Uncomment for
    # public repos or repos owned by Andrewnplus — neither can use org runners.
    # with:
    #   node-version: '22'
    #   # Set false when package.json has no such script — `npm run lint` on a
    #   # missing script is exit 1, not a skip.
    #   run-lint: false
    #   run-format-check: false
    #   runner-labels: '["ubuntu-latest"]'
